<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>単語帳 100問10択クイズ (No.501-600)</title>
  <meta name="description" content="単語帳 No.501〜600。出題は番号順。単語帳閲覧機能、ネイティブ音声・解説付き。">
  <meta name="theme-color" content="#1e3a8a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #16a34a;
      --success-light: #dcfce7;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (max-height: 520px) {
      body {
        height: auto;
        min-height: 100dvh;
        overflow-y: auto;
      }
    }

    .container {
      max-width: 920px;
      width: 100%;
      height: 100%;
      margin: 0 auto;
      padding: 0.5rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-height: 0;
    }

    header {
      flex-shrink: 0;
      background: var(--card-bg);
      padding: 0.45rem 0.85rem;
      border-radius: 0.75rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      border: 1px solid var(--border);
    }

    .title-group h1 {
      font-size: 1rem;
      font-weight: 800;
      color: #1e3a8a;
      display: flex;
      align-items: baseline;
      gap: 0.25rem;
      letter-spacing: -0.01em;
    }

    .range-sub {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-left: 0.25rem;
    }

    .controls {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      align-items: center;
    }

    select, button.control-btn, a.control-btn {
      padding: 0.32rem 0.65rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      user-select: none;
    }

    select:focus, button.control-btn:focus {
      outline: 2px solid var(--primary);
    }

    button.control-btn:hover, a.control-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    .btn-tab-active {
      background: #1e3a8a !important;
      color: #ffffff !important;
      border-color: #1e3a8a !important;
    }

    /* クイズエリア */
    #quizArea {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .quiz-card {
      flex: 1;
      min-height: 0;
      background: var(--card-bg);
      border-radius: 0.9rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .progress-bar-bg {
      height: 4px;
      width: 100%;
      background: var(--border);
      flex-shrink: 0;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #3b82f6);
      width: 1%;
      transition: width 0.25s ease;
    }

    .quiz-body {
      flex: 1;
      min-height: 0;
      padding: 0.7rem 1rem 0.8rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .question-header {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .q-number {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 0.24rem 0.6rem;
      border-radius: 0.45rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .q-number:hover {
      background: #dbeafe;
    }

    .pos-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: #475569;
      background: #f1f5f9;
      padding: 0.24rem 0.55rem;
      border-radius: 0.45rem;
    }

    .mode-select {
      padding: 0.22rem 0.45rem;
      font-size: 0.75rem;
    }

    .stat-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.18rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge-correct { background: var(--success-light); color: var(--success); }
    .badge-wrong { background: var(--danger-light); color: var(--danger); }
    .badge-accuracy { background: var(--primary-light); color: var(--primary); }

    .target-wrapper {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      padding: 0.15rem 0;
    }

    .target-word {
      font-size: clamp(1.35rem, 3vw, 1.95rem);
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 1.2;
    }

    .btn-audio {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 0.45rem;
      padding: 0.3rem 0.55rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-audio:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    /* 常時2列 10択グリッド */
    .choices-grid {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.45rem 0.6rem;
    }

    .choice-btn {
      min-height: 40px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 0.6rem;
      padding: 0.45rem 0.7rem;
      text-align: left;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
      transition: all 0.12s ease;
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .choice-key {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 5px;
      background: #f1f5f9;
      font-size: 0.75rem;
      font-weight: 700;
      color: #475569;
      flex-shrink: 0;
      border: 1px solid #cbd5e1;
    }

    .choice-text {
      overflow-wrap: anywhere;
      line-height: 1.25;
    }

    .choice-btn:hover:not(:disabled) .choice-key {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .choice-btn.dimmed {
      opacity: 0.5;
    }

    .choice-btn.correct {
      background: var(--success-light) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: 700;
      opacity: 1 !important;
    }
    .choice-btn.correct .choice-key {
      background: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }

    .choice-btn.wrong {
      background: var(--danger-light) !important;
      border-color: var(--danger) !important;
      color: var(--danger) !important;
      font-weight: 700;
      opacity: 1 !important;
    }
    .choice-btn.wrong .choice-key {
      background: var(--danger);
      color: #ffffff;
      border-color: var(--danger);
    }

    .choice-btn:disabled {
      cursor: default;
    }

    /* 固定位置フィードバックパネル (レイアウトシフトなし) */
    .feedback-panel {
      flex: 1;
      min-height: 118px;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      background: #f8fafc;
      padding: 0.6rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      overflow: hidden;
    }

    .feedback-panel.is-correct {
      background: #f0fdf4;
      border-color: #86efac;
    }

    .feedback-panel.is-wrong {
      background: #fef2f2;
      border-color: #fca5a5;
    }

    .feedback-idle {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
    }

    .feedback-answered {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      gap: 0.35rem;
    }

    .feedback-header {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .result-status {
      font-size: 0.88rem;
      font-weight: 800;
      line-height: 1.3;
    }
    .result-status.correct {
      color: var(--success);
    }
    .result-status.wrong {
      color: var(--danger);
    }

    .btn-next {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.45rem 1rem;
      font-size: 0.84rem;
      font-weight: 700;
      border-radius: 0.55rem;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .btn-next:hover {
      background: var(--primary-dark);
    }

    .explanation-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .example-en-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .example-en {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1e293b;
      line-height: 1.35;
    }

    .btn-audio-sm {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 0.72rem;
      padding: 0.12rem 0.4rem;
      border-radius: 4px;
      color: var(--primary);
      font-weight: 700;
      flex-shrink: 0;
    }
    .btn-audio-sm:hover {
      background: #e2e8f0;
    }

    .example-ja {
      font-size: 0.82rem;
      color: #475569;
      line-height: 1.35;
    }

    .notes-text {
      font-size: 0.76rem;
      color: #64748b;
      background: rgba(255, 255, 255, 0.75);
      padding: 0.28rem 0.5rem;
      border-radius: 0.4rem;
      border: 1px dashed var(--border);
      line-height: 1.35;
    }

    /* リザルト画面 */
    .result-view {
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }

    .result-score {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--primary);
      margin: 0.75rem 0;
    }

    .result-actions {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    /* 単語帳一覧ビュー */
    .wordbook-view {
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
    }

    .wordbook-card {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      padding: 0.9rem 1rem;
      border-radius: 0.9rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .wordbook-top {
      flex-shrink: 0;
    }

    .search-box {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border-radius: 0.65rem;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      margin-bottom: 0.65rem;
      outline: none;
    }
    .search-box:focus {
      border-color: var(--primary);
    }

    #wordListContainer {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 0.2rem;
    }

    .word-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 0.65rem;
      padding: 0.8rem 0.9rem;
      margin-bottom: 0.55rem;
    }
    .word-card:hover {
      box-shadow: var(--shadow-sm);
    }
    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.3rem;
      gap: 0.5rem;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .modal-content {
      background: #ffffff;
      border-radius: 1rem;
      max-width: 620px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 1.25rem;
      box-shadow: var(--shadow-lg);
    }
    .modal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
      gap: 0.45rem;
      margin-top: 0.85rem;
    }
    .grid-num-btn {
      height: 38px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .grid-num-btn:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .grid-num-btn.answered-correct { background: var(--success-light); color: var(--success); border-color: var(--success); }
    .grid-num-btn.answered-wrong { background: var(--danger-light); color: var(--danger); border-color: var(--danger); }
    .grid-num-btn.current { outline: 2px solid var(--primary); border-color: var(--primary); }

    @media (max-width: 640px) {
      .container {
        padding: 0.35rem 0.45rem;
        gap: 0.35rem;
      }
      header {
        padding: 0.38rem 0.6rem;
        gap: 0.35rem;
      }
      .title-group h1 {
        font-size: 0.9rem;
      }
      .range-sub {
        font-size: 0.72rem;
      }
      select, button.control-btn, a.control-btn {
        padding: 0.26rem 0.48rem;
        font-size: 0.72rem;
      }
      .quiz-body {
        padding: 0.5rem 0.65rem 0.6rem 0.65rem;
        gap: 0.4rem;
      }
      .choices-grid {
        gap: 0.35rem 0.4rem;
      }
      .choice-btn {
        min-height: 36px;
        padding: 0.35rem 0.45rem;
        font-size: 0.78rem;
        gap: 0.35rem;
      }
      .choice-key {
        width: 20px;
        height: 20px;
        font-size: 0.7rem;
      }
      .feedback-panel {
        min-height: 105px;
        padding: 0.5rem 0.65rem;
      }
      .btn-next {
        padding: 0.4rem 0.75rem;
        font-size: 0.78rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-group">
        <h1>単語帳<span class="range-sub">No.501-600</span></h1>
      </div>
      <div class="controls">
        <button class="control-btn btn-tab-active" id="btnQuizTab" onclick="showQuizTab()">クイズ</button>
        <button class="control-btn" id="btnWordbookTab" onclick="showWordbookTab()">単語帳一覧</button>
        <button class="control-btn" onclick="openJumpModal()">進捗一覧</button>
        <a class="control-btn" href="https://docs.google.com/spreadsheets/d/1BaAIXt7jKJIoEdopA-uozzmqyQw_e2ePdSPwFk4MSac/edit?usp=sharing" target="_blank" rel="noopener">単語帳(スプレットシート)</a>
      </div>
    </header>

    <!-- クイズ画面エリア -->
    <div id="quizArea">
      <div class="quiz-card" id="quizCard">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="quiz-body">
          <div class="question-header">
            <div class="header-left">
              <span class="q-number" id="qNumberBadge" onclick="openJumpModal()" title="クリックして問題一覧を開く">Q1 / 100 [No. 501]</span>
              <select id="modeSelect" class="mode-select" onchange="changeMode()">
                <option value="en_ja">英 → 日</option>
                <option value="ja_en">日 → 英</option>
              </select>
              <span class="pos-tag" id="posTag">動詞</span>
            </div>
            <div class="header-right">
              <span class="stat-badge badge-correct">○ <span id="correctCount">0</span></span>
              <span class="stat-badge badge-wrong">× <span id="wrongCount">0</span></span>
              <span class="stat-badge badge-accuracy"><span id="accuracyText">0.0%</span></span>
            </div>
          </div>

          <div class="target-wrapper">
            <div class="target-word" id="targetWord">aim</div>
            <button class="btn-audio" id="btnSpeakWord" title="単語の発音を聞く" onclick="speakTargetWord()">発音</button>
          </div>

          <div class="choices-grid" id="choicesGrid"></div>

          <div class="feedback-panel" id="feedbackPanel">
            <div class="feedback-idle" id="feedbackIdle">
              数字キー (1〜0) または選択肢をクリックして回答
            </div>
            <div class="feedback-answered" id="feedbackAnswered">
              <div class="feedback-header">
                <div id="resultStatus" class="result-status"></div>
                <button class="btn-next" id="btnNext" onclick="nextQuestion()">次の問題へ (Enter)</button>
              </div>
              <div class="explanation-body">
                <div class="example-en-row">
                  <span class="example-en" id="expEn"></span>
                  <button class="btn-audio-sm" id="btnSpeakSentence" title="例文の発音を聞く" onclick="speakSentence()">例文音声</button>
                </div>
                <div class="example-ja" id="expJa"></div>
                <div class="notes-text" id="expNotes"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="quiz-card result-view" id="resultView">
        <h2>お疲れ様でした！クイズ終了</h2>
        <p style="color: var(--text-muted); margin-top: 0.5rem;">全100問の挑戦が完了しました。</p>
        <div class="result-score" id="finalScore">95 / 100</div>
        <p id="finalAccuracy" style="font-size: 1.15rem; font-weight: 600; color: #334155;">正答率: 95.0%</p>
        <div class="result-actions">
          <button class="btn-next" style="padding: 0.7rem 1.4rem; font-size: 0.95rem;" onclick="retryWrongOnly()" id="btnRetryWrong">間違えた問題のみ復習</button>
          <button class="control-btn" style="padding: 0.7rem 1.4rem; font-size: 0.95rem;" onclick="resetQuiz()">もう一度最初から</button>
        </div>
      </div>
    </div>

    <!-- 素の単語帳一覧エリア -->
    <div id="wordbookArea" class="wordbook-view">
      <div class="wordbook-card">
        <div class="wordbook-top">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; flex-wrap: wrap; gap: 0.5rem;">
            <h2 style="font-size: 1.05rem; font-weight: 800; color: #1e3a8a;">単語帳一覧 (No.501 〜 600 全100語)</h2>
            <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
              <a class="control-btn" href="https://docs.google.com/spreadsheets/d/1BaAIXt7jKJIoEdopA-uozzmqyQw_e2ePdSPwFk4MSac/edit?usp=sharing" target="_blank" rel="noopener">単語帳(スプレットシート)</a>
              <a class="control-btn" href="TOEIC_Words_501-600_List.csv" download>CSV保存</a>
              <a class="control-btn" href="TOEIC_Words_501-600_100Quiz.xlsx" download>Excel保存</a>
            </div>
          </div>
          <input type="text" id="searchInput" class="search-box" placeholder="単語・意味・例文を検索..." oninput="filterWordList()">
        </div>
        <div id="wordListContainer"></div>
      </div>
    </div>
  </div>

  <!-- 問題一覧ジャンプモーダル -->

    const ALL_WORDS = [{"no": 501, "word": "aim", "pos": "動詞", "meaning": "向ける", "example_en": "Our campaign is aimed at young adults.", "example_ja": "当社のキャンペーンはヤングアダルトに向けられている。", "notes": "「目指す、目的とする」という意味もある（同: target「目標とする」） 名: aim「目的、目標」(=purpose, goal, target, objective)"}, {"no": 502, "word": "cooperate", "pos": "動詞", "meaning": "協力する", "example_en": "The team members have to cooperate with each other.", "example_ja": "部員はお互いに協力しなければならない。", "notes": "名: cooperation「協力」、形: cooperative「協力的な」"}, {"no": 503, "word": "quantity", "pos": "名詞", "meaning": "量", "example_en": "We get discounts when we buy materials in large quantities.", "example_ja": "資材を大量に買うと割引が受けられる。", "notes": "動: quantify「数値で表す」、形: quantitative「量的な」、反: quality「質」"}, {"no": 504, "word": "by accident", "pos": "熟語", "meaning": "偶然に", "example_en": "We met at the conference by accident.", "example_ja": "私たちは会議で偶然に会った。", "notes": "反: deliberately, intentionally, on purpose「わざと」、名: accident「事故」、形: accidental「偶然の」、副: accidentally「偶然に」"}, {"no": 505, "word": "launch", "pos": "動詞", "meaning": "始める", "example_en": "We launched an advertising campaign for our new products.", "example_ja": "当社は新製品のための広告キャンペーンを開始した。", "notes": "「発売を開始する」という意味も重要。名: launch「開始」"}, {"no": 506, "word": "obvious", "pos": "形容詞", "meaning": "明らかな", "example_en": "It is obvious that the company is not doing well.", "example_ja": "会社の業績がよくないことは明らかだ。", "notes": "副: obviously「明らかに」"}, {"no": 507, "word": "optimistic", "pos": "形容詞", "meaning": "楽観的な", "example_en": "I'm optimistic about the company's future.", "example_ja": "私は会社の将来について楽観的だ。", "notes": "反: pessimistic「悲観的な」、名: optimist「楽観的な人」（反: pessimist「悲観的な人」）"}, {"no": 508, "word": "owe", "pos": "動詞", "meaning": "〜のおかげである", "example_en": "I owe my success to my colleagues.", "example_ja": "私の成功は同僚のおかげである。", "notes": "「借りがある」という意味もある。owing to 〜「〜のおかげで」(=because of, due to, thanks to)"}, {"no": 509, "word": "vision", "pos": "名詞", "meaning": "考え", "example_en": "The company needs a clear vision for the future.", "example_ja": "その会社は将来に対する明確な考えが必要である。", "notes": "「視力、視界、展望」などの意味もある"}, {"no": 510, "word": "withdraw", "pos": "動詞", "meaning": "引き出す", "example_en": "I just withdrew three hundred dollars from my account.", "example_ja": "私は口座から300ドル下ろしたばかりです。", "notes": "過去: withdrew、過去分詞: withdrawn「手を引く、撤退する、取り消す」という意味もある。名: withdrawal「（預金の）引き出し、撤退、撤回」"}, {"no": 511, "word": "deliberately", "pos": "副詞", "meaning": "わざと", "example_en": "I deliberately misplaced the folder.", "example_ja": "私はわざとそのホルダーを違う場所に置いた。", "notes": "同: intentionally, on purpose「わざと」、形: deliberate「故意の」(=intentional)、動: deliberate「熟考する」、名: deliberation「熟考」、after long deliberation「長い熟考のあと」"}, {"no": 512, "word": "dismiss", "pos": "動詞", "meaning": "解雇する", "example_en": "She was unfairly dismissed from her post.", "example_ja": "彼女は職を不当に解雇された。", "notes": "同: fire「解雇する」、名: dismissal「解雇」"}, {"no": 513, "word": "glance", "pos": "動詞", "meaning": "さっと見る", "example_en": "He's glancing at a magazine.", "example_ja": "彼は雑誌にさっと目を通している。", "notes": "後ろに続く前置詞はat。名: glance「さっと見ること」、at a glance「一見して」"}, {"no": 514, "word": "ingredient", "pos": "名詞", "meaning": "材料", "example_en": "What are the ingredients in this salad?", "example_ja": "このサラダの材料はなんですか。", "notes": "「〜の材料」と言うとき、後ろに続く前置詞はin, of, forが可能"}, {"no": 515, "word": "capable", "pos": "形容詞", "meaning": "能力がある", "example_en": "Lucy Hill is quite capable of learning new skills.", "example_ja": "ルーシー・ヒルは新しいスキルを習得する能力がある。", "notes": "be capable of 〜の形で使われる。名: capability「能力」"}, {"no": 516, "word": "conclusion", "pos": "名詞", "meaning": "結論", "example_en": "We haven't reached a conclusion yet.", "example_ja": "私達はまだ結論に達していない。", "notes": "reach a conclusion「結論に達する」、動: conclude「結論を出す、終える」、形: conclusive「決定的な、最終的な」、conclusive evidence「決定的な証拠」"}, {"no": 517, "word": "emergency", "pos": "名詞", "meaning": "緊急事態", "example_en": "The emergency exit is down the hallway.", "example_ja": "非常口は廊下の先です。", "notes": "emergency room (略: ER)「（病院の）緊急治療室」、the state of emergency「非常事態」"}, {"no": 518, "word": "load", "pos": "動詞", "meaning": "積み込む", "example_en": "They're loading the truck with boxes.", "example_ja": "彼らはトラックに箱を積み込んでいる。", "notes": "反: unload「荷物を降ろす」、名: load「荷物、積載量、仕事量」、形: loaded「荷物を積んだ」"}, {"no": 519, "word": "punctual", "pos": "形容詞", "meaning": "時間を守る", "example_en": "Please try to be punctual.", "example_ja": "時間を守るようにしてください。", "notes": "名: punctuality「時間を守ること」、副: punctually「時間通りに」"}, {"no": 520, "word": "possibility", "pos": "名詞", "meaning": "可能性", "example_en": "The two banks are discussing the possibility of a merger.", "example_ja": "その2つの銀行は合併の可能性について話し合っている。", "notes": "「可能性がある事柄」という意味もある。形: possible「可能な」、副: possibly「もしかしたら、多分」(=maybe, perhaps)（probablyより可能性が低い）"}, {"no": 521, "word": "journal", "pos": "名詞", "meaning": "専門誌", "example_en": "Mr. Johnson contributes to this trade journal.", "example_ja": "ジョンソンさんはこの業界誌に寄稿している。", "notes": "専門性の高い雑誌・新聞を指す語。「日記」という意味もある。関: magazine「雑誌」、newspaper「新聞」、periodical「定期刊行物」"}, {"no": 522, "word": "policy", "pos": "名詞", "meaning": "規則", "example_en": "We have a strict non-smoking policy.", "example_ja": "当社には厳格な禁煙の規則があります。", "notes": "「方針、政策、（保険の）契約」などの意味もある。insurance policy「保険契約」"}, {"no": 523, "word": "appliance", "pos": "名詞", "meaning": "電化器具", "example_en": "The store carries a wide range of domestic appliances.", "example_ja": "その店は多様な家電製品を取り扱っている。", "notes": "appliance store「電器店」"}, {"no": 524, "word": "approach", "pos": "動詞", "meaning": "話を持ちかける", "example_en": "Several companies have approached us.", "example_ja": "数社が私達に話を持ちかけてきた。", "notes": "「近づく、取り組む」などの意味もある。名: approach「手法、申し入れ、近づくこと」、形: approachable「親しみやすい」"}, {"no": 525, "word": "standard", "pos": "名詞", "meaning": "基準", "example_en": "We have high safety standards.", "example_ja": "当社は高い安全基準を持っています。", "notes": "「規範」という意味もある。通常、standardsとsをつける。形: standard「標準の、基準となる」"}, {"no": 526, "word": "valid", "pos": "形容詞", "meaning": "有効な", "example_en": "You need a valid driver's license.", "example_ja": "あなたは有効な運転免許証が必要です。", "notes": "「正当な」という意味もある。反: invalid「無効な」、動: validate「証明する」"}, {"no": 527, "word": "eager", "pos": "形容詞", "meaning": "強く望んでいる", "example_en": "Our chef is eager to meet your catering needs.", "example_ja": "私たちのシェフはあなたの食事のご要望を満たすことを強く望んでいます。", "notes": "「熱心な」という意味もある。副: eagerly「熱心に」"}, {"no": 528, "word": "opinion", "pos": "名詞", "meaning": "意見", "example_en": "We would like to know your opinions about our service.", "example_ja": "私たちは当社のサービスに対するあなたのご意見をお聞きしたいと存じます。", "notes": "同: view「意見、見方」、in my opinion「私の考えでは」"}, {"no": 529, "word": "belongings", "pos": "名詞", "meaning": "持ち物", "example_en": "She packed her personal belongings in a bag.", "example_ja": "彼女は私物をかばんに詰めた。", "notes": "この意味では常に複数形"}, {"no": 530, "word": "assignment", "pos": "名詞", "meaning": "与えられた仕事", "example_en": "Marta has to complete the assignment by the end of October.", "example_ja": "マータはその仕事を10月末までに仕上げなければならない。", "notes": "「（学生に与えられた）課題」という意味もある。動: assign「割り当てる」"}, {"no": 531, "word": "innovative", "pos": "形容詞", "meaning": "革新的な", "example_en": "We develop innovative products and services.", "example_ja": "当社は革新的な製品とサービスを開発しています。", "notes": "動: innovate「（新しい技術・考えなどを）取り入れる」、名: innovation「革新、新しく取り入れたもの」、名: innovator「革新者」"}, {"no": 532, "word": "supervise", "pos": "動詞", "meaning": "監督する", "example_en": "Dr. Hall supervises the research team.", "example_ja": "ホール博士が研究チームを監督する。", "notes": "同: oversee「監督する」、名: supervision「監督」、名: supervisor「監督者」、形: supervisory「監督の」"}, {"no": 533, "word": "credit", "pos": "動詞", "meaning": "(功績があると)認める", "example_en": "He is credited with developing popular video games.", "example_ja": "彼は人気のビデオゲームを開発した功績を認められている。", "notes": "同: attribute「〜のおかげだと考える」、名: credit「クレジット、功績、履修単位」"}, {"no": 534, "word": "various", "pos": "形容詞", "meaning": "さまざまな", "example_en": "We offer various training programs.", "example_ja": "当社はさまざまな研修プログラムをご提供しております。", "notes": "動: vary「変化する」、名: variety「種類、多様さ」、名: variation「変化、差」"}, {"no": 535, "word": "analysis", "pos": "名詞", "meaning": "分析", "example_en": "I'm doing a cost analysis of the project.", "example_ja": "私はそのプロジェクトの費用分析をしている。", "notes": "複数形はanalyses。動: analyze「分析する」、名: analyst「評論家、専門家」、形: analytical「分析的な」"}, {"no": 536, "word": "reject", "pos": "動詞", "meaning": "却下する", "example_en": "The board of directors rejected my proposal.", "example_ja": "取締役会は私の提案を却下した。", "notes": "「拒否する、不合格にする、受け付けない」などの意味もある。同: turn down, refuse「却下する」、名: rejection「拒絶」"}, {"no": 537, "word": "on behalf of", "pos": "熟語", "meaning": "〜を代表して", "example_en": "Mr. Robinson made a speech on behalf of the association.", "example_ja": "ロビンソンさんは協会を代表してスピーチをした。", "notes": "「〜の代わりに」という意味もある"}, {"no": 538, "word": "overlook", "pos": "動詞", "meaning": "見逃す", "example_en": "I overlooked errors in the report.", "example_ja": "私は報告書の間違いを見逃した。", "notes": "「大目にみる、（建物から）見える」などの意味もある"}, {"no": 539, "word": "seal", "pos": "動詞", "meaning": "封をする", "example_en": "I sealed the box with tape.", "example_ja": "私はテープで箱に封をした。", "notes": "「密閉する、（建物・エリアなどを）封鎖する」などの意味もある。名: seal「封印、印鑑」"}, {"no": 540, "word": "typical", "pos": "形容詞", "meaning": "典型的な", "example_en": "These temperatures are not typical for this time of year.", "example_ja": "これらの気温はこの時期としては普通ではありません。", "notes": "typical of 〜「典型的な〜」、副: typically「典型的に、通常は」"}, {"no": 541, "word": "code", "pos": "名詞", "meaning": "規則", "example_en": "The company has a strict dress code.", "example_ja": "その会社は厳しい服装規則がある。", "notes": "「法律、記号、番号」などの意味もある。area code「市外局番」、a code of conduct「行動規範」"}, {"no": 542, "word": "connect", "pos": "動詞", "meaning": "接続する", "example_en": "You should connect the printer to the computer.", "example_ja": "プリンターをコンピュータに接続しなくてはなりません。", "notes": "「電話をつなぐ」という意味もある。名: connection「接続、関係、乗り継ぎ」"}, {"no": 543, "word": "general", "pos": "形容詞", "meaning": "大まかな", "example_en": "This map will give you a general overview of the area.", "example_ja": "この地図はその地区の大まかな概観を示します。", "notes": "「一般的な、全体的な、普通の」などの意味もある。副: generally「一般的に」"}, {"no": 544, "word": "nicely", "pos": "副詞", "meaning": "うまく", "exampl example_en": "The flight was canceled due to mechanical failure.", "example_ja": "機械的な故障により、その便は運行が中止された。", "notes": "名: machine(可算名詞)「機械」、名: machinery(不可算名詞)「機械」、副: mechanically「機械的に」"}, {"no": 597, "word": "rest", "pos": "名詞", "meaning": "残り", "example_en": "There's not much work for the rest of the day.", "example_ja": "今日、これから残りの時間はあまり仕事がない。", "notes": "「休息、休止」という意味もある。同: remainder「残り」、動: rest「休む、もたれかかる」"}, {"no": 598, "word": "unique", "pos": "形容詞", "meaning": "珍しい", "example_en": "The gift shop carries unique jewelry made of seashells.", "example_ja": "そのギフトショップでは貝殻でできた珍しいジュエリーを販売している。", "notes": "「独特の、唯一の」などの意味もある"}, {"no": 599, "word": "disappointed", "pos": "形容詞", "meaning": "がっかりした", "example_en": "We are disappointed with the results.", "example_ja": "私たちはその結果にがっかりした。", "notes": "動: disappoint「がっかりさせる」、形: disappointing「がっかりさせるような」、名: disappointment「失望」"}, {"no": 600, "word": "modest", "pos": "形容詞", "meaning": "多くない", "example_en": "I've saved a modest amount of money.", "example_ja": "私は少額のお金を貯めた。", "notes": "「謙虚な、控えめな」などの意味もある。名: modesty「謙遜」"}];
    const CHOICE_KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"];

    let currentMode = "en_ja";
    let questionsList = [];
    let currentIndex = 0;
    let correctTotal = 0;
    let wrongTotal = 0;
    let wrongQuestions = [];
    let isAnswered = false;
    let answerHistory = {};
    let currentChoicesData = null;

    function generateDynamicChoices(targetItem, mode) {
      const isEnJa = (mode === "en_ja");
      const correctAnswer = isEnJa ? targetItem.meaning : targetItem.word;

      const others = ALL_WORDS.filter(w => w.no !== targetItem.no);
      const shuffledOthers = [...others].sort(() => Math.random() - 0.5);

      const dummyAnswers = [];
      for (const item of shuffledOthers) {
        const ans = isEnJa ? item.meaning : item.word;
        if (ans !== correctAnswer && !dummyAnswers.includes(ans)) {
          dummyAnswers.push(ans);
        }
        if (dummyAnswers.length === 9) break;
      }

      const choices = [correctAnswer, ...dummyAnswers];
      choices.sort(() => Math.random() - 0.5);

      const correctLetter = CHOICE_KEYS[choices.indexOf(correctAnswer)];

      return {
        choices: choices,
        correctLetter: correctLetter
      };
    }

    function init() {
      questionsList = [...ALL_WORDS];
      currentIndex = 0;
      correctTotal = 0;
      wrongTotal = 0;
      wrongQuestions = [];
      isAnswered = false;
      answerHistory = {};

      document.getElementById("correctCount").textContent = "0";
      document.getElementById("wrongCount").textContent = "0";
      document.getElementById("accuracyText").textContent = "0.0%";

      document.getElementById("quizCard").style.display = "flex";
      document.getElementById("resultView").style.display = "none";

      renderQuestion();
    }

    function changeMode() {
      const modeSelect = document.getElementById("modeSelect");
      currentMode = modeSelect.value;
      modeSelect.blur();
      init();
    }

    function resetQuiz() {
      init();
    }

    function renderQuestion() {
      isAnswered = false;
      const q = questionsList[currentIndex];

      document.getElementById("qNumberBadge").textContent = `Q${currentIndex + 1} / ${questionsList.length} [No. ${q.no}]`;
      document.getElementById("posTag").textContent = q.pos;

      const pct = (currentIndex / questionsList.length) * 100;
      document.getElementById("progressBar").style.width = `${Math.max(pct, 1)}%`;

      const target = currentMode === "en_ja" ? q.word : q.meaning;
      document.getElementById("targetWord").textContent = target;

      const audioBtn = document.getElementById("btnSpeakWord");
      audioBtn.style.display = (currentMode === "en_ja") ? "inline-flex" : "none";

      currentChoicesData = generateDynamicChoices(q, currentMode);

      const grid = document.getElementById("choicesGrid");
      grid.innerHTML = "";

      currentChoicesData.choices.forEach((choice, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice-btn";

        const keySpan = document.createElement("span");
        keySpan.className = "choice-key";
        keySpan.textContent = CHOICE_KEYS[idx];

        const textSpan = document.createElement("span");
        textSpan.className = "choice-text";
        textSpan.textContent = choice;

        btn.appendChild(keySpan);
        btn.appendChild(textSpan);
        btn.addEventListener("click", () => handleAnswer(CHOICE_KEYS[idx], btn, q));
        grid.appendChild(btn);
      });

      const feedbackPanel = document.getElementById("feedbackPanel");
      feedbackPanel.classList.remove("is-correct", "is-wrong");
      document.getElementById("feedbackIdle").style.display = "flex";
      document.getElementById("feedbackAnswered").style.display = "none";
    }

    function handleAnswer(selectedKey, clickedBtn, q) {
      if (isAnswered) return;
      isAnswered = true;

      if (document.activeElement && document.activeElement !== document.body) {
        document.activeElement.blur();
      }

      const isCorrect = (selectedKey === currentChoicesData.correctLetter);
      answerHistory[q.no] = isCorrect ? 'correct' : 'wrong';

      const allBtns = document.querySelectorAll(".choice-btn");
      allBtns.forEach((btn, idx) => {
        btn.disabled = true;
        if (CHOICE_KEYS[idx] === currentChoicesData.correctLetter) {
          btn.classList.add("correct");
        } else if (btn !== clickedBtn) {
          btn.classList.add("dimmed");
        }
      });

      const feedbackPanel = document.getElementById("feedbackPanel");
      const statusEl = document.getElementById("resultStatus");
      feedbackPanel.classList.remove("is-correct", "is-wrong");

      if (isCorrect) {
        correctTotal++;
        document.getElementById("correctCount").textContent = correctTotal;
        feedbackPanel.classList.add("is-correct");
        statusEl.className = "result-status correct";
        statusEl.textContent = "正解";
      } else {
        wrongTotal++;
        document.getElementById("wrongCount").textContent = wrongTotal;
        clickedBtn.classList.add("wrong");
        wrongQuestions.push(q);
        feedbackPanel.classList.add("is-wrong");
        const correctAns = currentMode === "en_ja" ? q.meaning : q.word;
        statusEl.className = "result-status wrong";
        statusEl.textContent = `不正解 — 正解: [${currentChoicesData.correctLetter}] ${correctAns}`;
      }

      const answeredCount = correctTotal + wrongTotal;
      const acc = answeredCount > 0 ? ((correctTotal / answeredCount) * 100).toFixed(1) : "0.0";
      document.getElementById("accuracyText").textContent = `${acc}%`;

      document.getElementById("expEn").textContent = q.example_en;
      document.getElementById("expJa").textContent = q.example_ja;
      document.getElementById("expNotes").textContent = q.notes;

      document.getElementById("feedbackIdle").style.display = "none";
      document.getElementById("feedbackAnswered").style.display = "flex";
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < questionsList.length) {
        renderQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById("quizCard").style.display = "none";
      const resView = document.getElementById("resultView");
      resView.style.display = "flex";

      document.getElementById("progressBar").style.width = "100%";
      document.getElementById("finalScore").textContent = `${correctTotal} / ${questionsList.length}`;
      const acc = ((correctTotal / questionsList.length) * 100).toFixed(1);
      document.getElementById("finalAccuracy").textContent = `正答率: ${acc}%`;

      const btnRetry = document.getElementById("btnRetryWrong");
      if (wrongQuestions.length === 0) {
        btnRetry.style.display = "none";
      } else {
        btnRetry.style.display = "inline-block";
        btnRetry.textContent = `間違えた${wrongQuestions.length}問のみ復習`;
      }
    }

    function retryWrongOnly() {
      if (wrongQuestions.length === 0) return;
      questionsList = [...wrongQuestions];
      currentIndex = 0;
      correctTotal = 0;
      wrongTotal = 0;
      wrongQuestions = [];
      isAnswered = false;

      document.getElementById("correctCount").textContent = "0";
      document.getElementById("wrongCount").textContent = "0";
      document.getElementById("accuracyText").textContent = "0.0%";

      document.getElementById("quizCard").style.display = "flex";
      document.getElementById("resultView").style.display = "none";

      renderQuestion();
    }

    function openJumpModal() {
      const grid = document.getElementById("jumpGrid");
      grid.innerHTML = "";
      questionsList.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "grid-num-btn";
        btn.textContent = q.no;
        if (idx === currentIndex) btn.classList.add("current");
        if (answerHistory[q.no] === 'correct') btn.classList.add("answered-correct");
        if (answerHistory[q.no] === 'wrong') btn.classList.add("answered-wrong");
        btn.onclick = () => {
          currentIndex = idx;
          document.getElementById("jumpModal").style.display = "none";
          showQuizTab();
          document.getElementById("quizCard").style.display = "flex";
          document.getElementById("resultView").style.display = "none";
          renderQuestion();
        };
        grid.appendChild(btn);
      });
      document.getElementById("jumpModal").style.display = "flex";
    }

    function closeJumpModal(e) {
      if (e.target.id === 'jumpModal') {
        document.getElementById("jumpModal").style.display = "none";
      }
    }

    /* タブ切り替え */
    function showQuizTab() {
      document.getElementById("quizArea").style.display = "flex";
      document.getElementById("wordbookArea").style.display = "none";
      document.getElementById("btnQuizTab").classList.add("btn-tab-active");
      document.getElementById("btnWordbookTab").classList.remove("btn-tab-active");
    }

    function showWordbookTab() {
      document.getElementById("quizArea").style.display = "none";
      document.getElementById("wordbookArea").style.display = "flex";
      document.getElementById("btnQuizTab").classList.remove("btn-tab-active");
      document.getElementById("btnWordbookTab").classList.add("btn-tab-active");
      filterWordList();
    }

    function renderWordbookList(words) {
      const container = document.getElementById("wordListContainer");
      container.innerHTML = "";
      words.forEach(w => {
        const card = document.createElement("div");
        card.className = "word-card";

        const header = document.createElement("div");
        header.className = "word-header";

        const leftInfo = document.createElement("div");
        const noSpan = document.createElement("span");
        noSpan.style.cssText = "font-weight: 800; color: #1e3a8a; font-size: 0.85rem; margin-right: 0.45rem;";
        noSpan.textContent = `No.${w.no}`;

        const wordStrong = document.createElement("strong");
        wordStrong.style.cssText = "font-size: 1.1rem; color: #0f172a;";
        wordStrong.textContent = w.word;

        const posSpan = document.createElement("span");
        posSpan.style.cssText = "font-size: 0.78rem; background: #f1f5f9; padding: 0.15rem 0.45rem; border-radius: 4px; margin-left: 0.45rem; color: #475569;";
        posSpan.textContent = w.pos;

        leftInfo.appendChild(noSpan);
        leftInfo.appendChild(wordStrong);
        leftInfo.appendChild(posSpan);

        const speakBtn = document.createElement("button");
        speakBtn.type = "button";
        speakBtn.className = "btn-audio-sm";
        speakBtn.textContent = "発音";
        speakBtn.addEventListener("click", () => speakDirect(w.word));

        header.appendChild(leftInfo);
        header.appendChild(speakBtn);

        const meaningDiv = document.createElement("div");
        meaningDiv.style.cssText = "font-size: 0.95rem; font-weight: 700; color: #2563eb; margin-bottom: 0.3rem;";
        meaningDiv.textContent = w.meaning;

        const exEnDiv = document.createElement("div");
        exEnDiv.style.cssText = "font-size: 0.88rem; font-weight: 600; color: #334155; margin-bottom: 0.15rem;";
        exEnDiv.textContent = w.example_en;

        const exJaDiv = document.createElement("div");
        exJaDiv.style.cssText = "font-size: 0.82rem; color: #64748b; margin-bottom: 0.3rem;";
        exJaDiv.textContent = w.example_ja;

        const notesDiv = document.createElement("div");
        notesDiv.style.cssText = "font-size: 0.78rem; background: #f8fafc; padding: 0.3rem 0.55rem; border-radius: 4px; color: #475569;";
        notesDiv.textContent = w.notes;

        card.appendChild(header);
        card.appendChild(meaningDiv);
        card.appendChild(exEnDiv);
        card.appendChild(exJaDiv);
        card.appendChild(notesDiv);
        container.appendChild(card);
      });
    }

    function filterWordList() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = ALL_WORDS.filter(w =>
        w.word.toLowerCase().includes(q) ||
        w.meaning.toLowerCase().includes(q) ||
        w.no.toString().includes(q) ||
        w.example_en.toLowerCase().includes(q) ||
        w.example_ja.toLowerCase().includes(q)
      );
      renderWordbookList(filtered);
    }

    function speakDirect(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }

    function speakText(text) {
      speakDirect(text);
    }

    function speakTargetWord() {
      const q = questionsList[currentIndex];
      speakText(q.word);
    }

    function speakSentence() {
      const q = questionsList[currentIndex];
      speakText(q.example_en);
    }

    window.addEventListener("keydown", (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;

      const jumpModal = document.getElementById("jumpModal");
      if (jumpModal.style.display === "flex") {
        if (e.key === "Escape") {
          jumpModal.style.display = "none";
        }
        return;
      }

      if (document.getElementById("wordbookArea").style.display === "flex") return;
      if (document.getElementById("resultView").style.display === "flex") return;

      if (!isAnswered) {
        const fullToHalf = {'１':'1','２':'2','３':'3','４':'4','５':'5','６':'6','７':'7','８':'8','９':'9','０':'0'};
        const normalizedKey = fullToHalf[e.key] || e.key;
        const index = CHOICE_KEYS.indexOf(normalizedKey);
        if (index !== -1) {
          const btns = document.querySelectorAll(".choice-btn");
          if (btns[index]) btns[index].click();
        }
      } else {
        if (e.key === "Enter" || e.key === " " || e.key === "ArrowRight") {
          e.preventDefault();
          nextQuestion();
        }
      }
    });

    init();
  </script>
</body>
</html>
